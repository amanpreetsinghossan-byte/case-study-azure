trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  RESOURCE_GROUP: 'RG-User03'
  VM1: 'aso-vm-web-01'
  VM2: 'aso-vm-web-02'

stages:
- stage: Deploy
  jobs:
  - job: DeployApp
    steps:

    - checkout: self

    - task: AzureCLI@2
      inputs:
        azureSubscription: 'aso-azure-connection'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |

          echo "Encoding files..."

          HTML=$(base64 -w 0 index.html)
          SERVER=$(base64 -w 0 server.js)
          PACKAGE=$(base64 -w 0 package.json)

          for VM in $(VM1) $(VM2)
          do
            echo "Deploying to $VM"

            az vm run-command invoke \
              --resource-group "$(RESOURCE_GROUP)" \
              --name "$VM" \
              --command-id RunShellScript \
              --scripts "
                sudo apt update -y
                sudo apt install -y nodejs npm nginx

                echo '$HTML' | base64 -d | sudo tee /var/www/html/index.html
                echo '$SERVER' | base64 -d | sudo tee /home/azureuser/server.js
                echo '$PACKAGE' | base64 -d | sudo tee /home/azureuser/package.json

                cd /home/azureuser
                npm install

                # Kill old node if running
                pkill node || true

                # Set environment variables (IMPORTANT)
                export DB_USER='asoadmin'
                export DB_PASSWORD='Amanossan@01'
                export DB_SERVER='aso-mysql-server-8899.database.windows.net'
                export DB_NAME='aso-sqldb-myecomm'

                nohup node server.js > app.log 2>&1 &

                sudo systemctl restart nginx
              "
          done